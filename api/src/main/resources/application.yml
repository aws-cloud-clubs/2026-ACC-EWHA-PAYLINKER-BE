spring:
  application:
    name: paylinker-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
          jwk-set-uri: ${COGNITO_JWK_SET_URI}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

aws:
  region: ${AWS_REGION:ap-northeast-2}
  sqs:
    email-queue-url: ${SQS_EMAIL_QUEUE_URL}
    email-dlq-url: ${SQS_EMAIL_DLQ_URL}
  ses:
    from-email: ${SES_FROM_EMAIL}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    app-client-id: ${COGNITO_APP_CLIENT_ID}
  dynamodb:
    table-prefix: ${DYNAMODB_TABLE_PREFIX:dev-paylinker}
  s3:
    document-bucket: ${S3_DOCUMENT_BUCKET}
    upload-bucket: ${S3_UPLOAD_BUCKET}

paylinker:
  link:
    session-ttl-seconds: 900
    scheduler-lock-ttl-seconds: 50
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
