spring:
  application:
    name: paylinker-api
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
  config:
    import:
      - optional:aws-secretsmanager:/dev/paylinker/app
      - optional:aws-secretsmanager:/dev/paylinker/dynamodb
      - optional:aws-secretsmanager:/dev/paylinker/redis
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
          jwk-set-uri: ${COGNITO_JWK_SET_URI}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, redis
      show-details: never

aws:
  region: ${AWS_REGION:ap-northeast-2}
  sqs:
    email-queue-url: ${SQS_EMAIL_QUEUE_URL}
    email-dlq-url: ${SQS_EMAIL_DLQ_URL}
  ses:
    from-email: ${SES_FROM_EMAIL}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID}
    app-client-id: ${COGNITO_APP_CLIENT_ID}
  dynamodb:
    table-prefix: ${DYNAMODB_TABLE_PREFIX:dev-paylinker}
    campaign-recipient:
      gsi1-name: ${CAMPAIGN_RECIPIENT_GSI1_NAME:campaign-recipient-gsi1}
      gsi2-name: ${CAMPAIGN_RECIPIENT_GSI2_NAME:campaign-recipient-gsi2}
  s3:
    document-bucket: ${S3_DOCUMENT_BUCKET}
    upload-bucket: ${S3_UPLOAD_BUCKET}

paylinker:
  link:
    session-ttl-seconds: 900
    scheduler-lock-ttl-seconds: 50
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
  campaign-limit:
    max-recipients: ${MAX_RECIPIENTS:5000}
  upload-batch:
    file-storage-key: ${UPLOAD_BATCH_FILE_STORAGE_KEY:recipients}
