name: Deploy Admin API to Amazon ECR

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write # AWS OIDC 인증을 위해 필수
  contents: read  # 코드 읽기 권한

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 가상 환경에 소스코드 다운로드
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 21 및 Gradle 빌드 환경 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. api 모듈 스프링 부트 빌드 (.jar 파일 생성)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :api:bootJar -x test

      # 4. AWS OIDC 로그인 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 5. Amazon ECR 컨테이너 저장소 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Docker 이미지 빌드 및 지정된 태그로 ECR에 푸시
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # docker/Dockerfile.api 를 사용해 api/build/libs/*.jar 기반으로 이미지 빌드
          docker build \
            -f docker/Dockerfile.api \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          # latest + commit SHA 두 태그 모두 ECR에 업로드
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
