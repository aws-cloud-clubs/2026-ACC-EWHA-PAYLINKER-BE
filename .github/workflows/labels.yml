- name: "perf"
  color: "0052CC"
  description: "성능 개선"

- name: "ci"
  color: "B60205"
  description: "CI/CD 설정 변경"

# ══════════════════════════════════════════════════════
#  STATUS 라벨 — 작업 진행 상태
# ══════════════════════════════════════════════════════
- name: "status: todo"
  color: "EDEDED"
  description: "아직 시작하지 않은 작업"

- name: "status: in progress"
  color: "FBCA04"
  description: "현재 진행 중인 작업"

- name: "status: in review"
  color: "0E8A16"
  description: "코드 리뷰 진행 중"

- name: "status: blocked"
  color: "B60205"
  description: "다른 작업에 의해 블로킹된 상태"

- name: "status: done"
  color: "006B75"
  description: "작업 완료"

