- name: "priority: high"
  color: "B60205"
  description: "긴급하게 처리해야 하는 작업"

- name: "priority: medium"
  color: "FBCA04"
  description: "일반적인 우선순위"

- name: "priority: low"
  color: "0E8A16"
  description: "여유 있을 때 처리해도 되는 작업"
