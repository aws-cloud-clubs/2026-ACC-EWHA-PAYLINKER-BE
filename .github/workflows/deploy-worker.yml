name: Deploy Email Worker to AWS Lambda

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build worker shadowJar
        run: |
          chmod +x ./gradlew
          ./gradlew :worker:shadowJar -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Lambda configuration (handler)
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-configuration \
            --function-name $LAMBDA_FUNCTION_NAME \
            --handler com.paylinker.worker.EmailWorkerHandler::handleRequest
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION_NAME

      - name: Update Lambda function code
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          ARTIFACT=$(ls worker/build/libs/worker-*.jar | grep -v sources | grep -v javadoc | head -n 1)
          echo "Uploading $ARTIFACT"
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://$ARTIFACT
