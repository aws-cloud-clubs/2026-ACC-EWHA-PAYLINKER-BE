name: Deploy Email Worker to AWS Lambda

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write # AWS OIDC 인증을 위해 필수
  contents: read  # 코드 읽기 권한

jobs:
  build-and-deploy:
    name: Build and Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 가상 환경에 소스코드 다운로드
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 21 및 Gradle 빌드 환경 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. worker 모듈 빌드 (Lambda 배포용 jar 생성)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :worker:build -x test

      # 4. AWS OIDC 로그인 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 5. 빌드 산출물을 Lambda 함수에 직접 업로드 (S3 경유 없음)
      - name: Update Lambda function code
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          ARTIFACT=$(ls worker/build/libs/*.jar | head -n 1)
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://$ARTIFACT
