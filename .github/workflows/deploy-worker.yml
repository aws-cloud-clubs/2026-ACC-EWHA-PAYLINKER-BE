name: Deploy Email Workers to AWS Lambda

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  SES_EVENT_LAMBDA_NAME: dev-paylinker-ses-event-worker

jobs:
  build-and-deploy:
    name: Build and Deploy Lambdas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build worker shadowJar
        run: |
          chmod +x ./gradlew
          ./gradlew :worker:shadowJar -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve artifact path
        id: artifact
        run: |
          ARTIFACT=$(ls worker/build/libs/worker-*.jar | grep -v sources | grep -v javadoc | head -n 1)
          echo "path=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "Using $ARTIFACT"

      # ── email-worker (SQS → SES 발송) ───────────────────────────
      - name: Update email-worker handler
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-configuration \
            --function-name $LAMBDA_FUNCTION_NAME \
            --handler com.paylinker.worker.EmailWorkerHandler::handleRequest
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION_NAME

      - name: Update email-worker code
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://${{ steps.artifact.outputs.path }}
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION_NAME

      # ── ses-event-worker (SES → SNS → SQS → DynamoDB 갱신) ──────
      - name: Update ses-event-worker handler
        run: |
          aws lambda update-function-configuration \
            --function-name $SES_EVENT_LAMBDA_NAME \
            --handler com.paylinker.worker.sesevent.SesEventHandler::handleRequest
          aws lambda wait function-updated \
            --function-name $SES_EVENT_LAMBDA_NAME

      - name: Update ses-event-worker code
        run: |
          aws lambda update-function-code \
            --function-name $SES_EVENT_LAMBDA_NAME \
            --zip-file fileb://${{ steps.artifact.outputs.path }}
          aws lambda wait function-updated \
            --function-name $SES_EVENT_LAMBDA_NAME
