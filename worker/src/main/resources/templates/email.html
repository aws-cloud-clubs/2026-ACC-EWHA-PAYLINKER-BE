<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="color-scheme" content="light only"/>
  <meta name="supported-color-schemes" content="light"/>
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#F6F8FB;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F6F8FB;padding:40px 16px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background-color:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(8,21,44,0.06);">
        <tr><td style="background-color:#1A2C4F;padding:32px 36px 28px;">
          <div style="color:#00D4A8;font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;">PAYLINKER</div>
          <div style="color:#FFFFFF;font-size:22px;font-weight:700;line-height:1.4;">{{subject}}</div>
          <div style="color:#C8D1E0;font-size:13px;margin-top:6px;">{{campaignName}}</div>
        </td></tr>
        <tr><td style="padding:36px 36px 28px;color:#2A3349;font-size:15px;line-height:1.7;">
          <div style="margin-bottom:16px;">{{recipientName}} 님, 안녕하세요.</div>
          <div style="margin-bottom:24px;white-space:pre-line;">{{description}}</div>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 24px;">
            <tr><td style="background-color:#00D4A8;border-radius:10px;">
              <a href="{{linkUrl}}" target="_blank" style="display:inline-block;padding:14px 32px;color:#08152C;font-weight:700;font-size:15px;text-decoration:none;letter-spacing:0.2px;">명세서 확인하기</a>
            </td></tr>
          </table>
          {{#hasExpires}}
          <div style="font-size:13px;color:#67748D;margin-bottom:8px;">확인 가능 기한: {{expiresAtKst}}</div>
          {{/hasExpires}}
          <div style="font-size:13px;color:#67748D;">버튼이 동작하지 않으면 아래 주소를 브라우저에 직접 붙여넣어 주세요.</div>
          <div style="font-size:12px;color:#6E80A0;margin-top:4px;word-break:break-all;">{{linkUrl}}</div>
        </td></tr>
        <tr><td style="background-color:#ECEFF4;padding:20px 36px;font-size:12px;color:#67748D;text-align:center;line-height:1.6;">
          본 메일은 발신 전용입니다. 문의는 운영 담당자에게 부탁드립니다.<br/>
          {{#hasUnsubscribe}}<a href="{{unsubscribeUrl}}" style="color:#67748D;text-decoration:underline;">수신 거부</a><br/>{{/hasUnsubscribe}}
          &copy; PayLinker
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
